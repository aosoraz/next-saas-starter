name: Keterix Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: keterix-saas-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image (railpack)
        id: build
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          IMAGE="ghcr.io/aosoraz/next-saas-starter:${GITHUB_SHA::12}"
          if [ -f Dockerfile ]; then
            docker build -t "$IMAGE" .
          else
            docker run --rm --privileged -d --name buildkit moby/buildkit:latest
            export BUILDKIT_HOST=docker-container://buildkit
            sleep 2
            curl -sSL https://railpack.com/install.sh | sh
            railpack build . --name "$IMAGE"
          fi
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Notify Keterix control plane
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ steps.build.outputs.image }}
          CALLBACK_URL: ${{ secrets.KETERIX_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_HMAC_SECRET }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="ghcr.io/aosoraz/next-saas-starter:${GITHUB_SHA::12}"
          fi
          BODY=$(jq -nc \
            --arg project_id "ca223dc2-0369-4726-a0b2-48909ce39f34" \
            --arg status "$JOB_STATUS" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg image_tag "$IMAGE_TAG" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg commit_message "$COMMIT_MSG" \
            '{project_id:$project_id,status:$status,commit_sha:$commit_sha,image_tag:$image_tag,run_id:($run_id|tonumber),commit_message:$commit_message}')
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" | awk '{print $NF}')
          curl -fsS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Keterix-Signature: sha256=$SIG" \
            -d "$BODY"
